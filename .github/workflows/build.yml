# Builds and tests the bridge on Linux, macOS and Windows, then makes the
# NuGet package with the native library of all three, and the binary zip
# (rexxnet-*.zip: all three, with install.rex), which it then installs and
# checks on each of them. ooRexx comes from its portable builds on SourceForge, pinned to one
# revision: the bridge needs at least r13267 (ooRexx bug #2106, fixed there),
# and a newer one is taken deliberately, after checking it.
#
# A tag vX.Y.Z[-suffix] (git tag v0.1.0-preview.1 && git push origin
# v0.1.0-preview.1) also publishes: the package, with that version, to
# nuget.org (trusted publishing: a policy on nuget.org for this repository
# and build.yml; the secret NUGET_USER, the nuget.org user name), and a
# GitHub release with the package
# and the binary zip. Pushes to main publish nothing.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  OOREXX_REV: "13271"
  OOREXX_URL: https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            oorexx: ubuntu2404.x86_64
            native: librexxnet.so
          - name: osx-arm64
            os: macos-14
            oorexx: macos.arm64.x86_64
            native: librexxnet.dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20                   # a hang fails here, not after 6 hours
    steps:
      - run: echo "REXXNET_BUILD=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release/bin" >> "$GITHUB_PATH"
      - run: rexx -v
      - name: Test suites
        run: bridge/tests/run.sh
      - name: lifetime-end, core dumps (debug)
        if: failure() && runner.os == 'macOS'
        run: |
          OUT="$REXXNET_BUILD/rexxnet"
          dotnet build bridge/tests/TestLib -c Release -o "$RUNNER_TEMP/tl" -p:RexxNetDir="$OUT" -nologo -v q
          sudo sysctl kern.coredump=1 || true
          sudo chmod 1777 /cores || true
          ulimit -c unlimited
          cd "$OUT"
          for i in 1 2 3; do
            env DYLD_LIBRARY_PATH=. rexx "$GITHUB_WORKSPACE/bridge/tests/lifetime.rex" "$RUNNER_TEMP/tl/TestLib.dll" 2>&1 | grep -v "^ok" || true
          done
          for i in 1 2 3; do       # the child alone, its output through a pipe
            env DYLD_LIBRARY_PATH=. rexx "$GITHUB_WORKSPACE/bridge/tests/lifetime-end.rex" "$RUNNER_TEMP/tl/TestLib.dll" 2>&1 | cat > le.out
            echo "piped $i: uninits $(grep -c '^uninit' le.out)"
          done
          ls -la /cores || true
          core=$(ls -t /cores/core.* 2>/dev/null | head -1)
          if [ -n "$core" ]; then
            lldb --batch -c "$core" "$(command -v rexx)" -o "thread backtrace all" -o "image list" | head -400
          fi
      - name: The guide's examples
        run: rexx docs/check-guide.rex
      - name: The books' examples
        run: rexx docs/check-books.rex
      - name: Smoke tests
        if: runner.os == 'Linux'
        run: smoke/run.sh && smoke/hostapi/run.sh
      - name: PowerShell sample
        shell: pwsh
        run: ./samples/powershell/hello.ps1 "$env:REXXNET_BUILD/rexxnet"
      - name: Samples
        run: rexx samples/check-samples.rex
      - name: C# sample (the package on nuget.org)
        run: dotnet run --project samples/csharp/hello
      - name: C# and VB.NET tours (the bridge built here)
        run: |
          dotnet run --project samples/csharp/tour -p:RexxNetDir="$REXXNET_BUILD/rexxnet"
          dotnet run --project samples/vbnet/tour -p:RexxNetDir="$REXXNET_BUILD/rexxnet"
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.name }}
          path: ${{ env.REXXNET_BUILD }}/rexxnet/${{ matrix.native }}

  windows:
    name: win-x64
    runs-on: windows-2022
    timeout-minutes: 20                   # a hang fails here, not after 6 hours
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'oorexx.zip'
          # curl, not Invoke-WebRequest: SourceForge gives a browser-like
          # client its download page instead of the file
          curl.exe -sSfL --retry 3 -o $zip "$env:OOREXX_URL/oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64-portable-release.zip"
          if ($LASTEXITCODE) { exit 1 }
          Expand-Archive $zip $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64-portable-release\bin" |
            Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: rexx -v
      - name: Test suites
        shell: pwsh
        run: |
          bridge\tests\run.ps1 -Out "$env:RUNNER_TEMP\build\rexxnet"
          exit $LASTEXITCODE
      - name: The guide's examples
        run: rexx docs\check-guide.rex "${{ runner.temp }}\build\rexxnet"
      - name: The books' examples (the Windows ones too)
        run: rexx docs\check-books.rex "${{ runner.temp }}\build\rexxnet"
      - name: PowerShell sample
        shell: pwsh
        run: .\samples\powershell\hello.ps1 "$env:RUNNER_TEMP\build\rexxnet"
      - name: Samples
        run: rexx samples\check-samples.rex "${{ runner.temp }}\build\rexxnet"
      - name: ooDialog's dialogs and their ports, measured
        continue-on-error: true           # a report, not a test
        timeout-minutes: 5
        run: rexx samples\oodialog-net\measure-dialogs.rex "${{ runner.temp }}\build\rexxnet"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: measure-dialogs
          path: measure-dialogs.log
          if-no-files-found: ignore
      - name: C# sample (the package on nuget.org)
        run: dotnet run --project samples\csharp\hello
      - name: C# and VB.NET tours (the bridge built here)
        shell: pwsh
        run: |
          dotnet run --project samples\csharp\tour "-p:RexxNetDir=$env:RUNNER_TEMP\build\rexxnet"
          if ($LASTEXITCODE) { exit 1 }
          dotnet run --project samples\vbnet\tour "-p:RexxNetDir=$env:RUNNER_TEMP\build\rexxnet"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v6
        with:                             # (with its runtime configurations: the desktop framework)
          name: native-win-x64
          path: |
            ${{ runner.temp }}\build\rexxnet\rexxnet.dll
            ${{ runner.temp }}\build\rexxnet\Rexx.Net.runtimeconfig.json
            ${{ runner.temp }}\build\rexxnet\Rexx.Net.core.runtimeconfig.json

  # The books (docs/books), as PDFs and HTML, with ooRexx's own documentation
  # tools (docs/trunk/tools/bldoc_orx, from ooRexx's SVN) and the Rexx
  # Parser, which highlights their Rexx listings: artifact books. (Their
  # examples are run by the jobs above: docs/check-books.rex.)
  books:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0                  # the tags: the books' version
      - name: DocBook, xsltproc, FOP, Subversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion xsltproc docbook-xml docbook-xsl fop fonts-liberation zip >/dev/null
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release/bin" >> "$GITHUB_PATH"
      - name: ooRexx's documentation tools, and the Rexx Parser
        run: |
          U=https://svn.code.sf.net/p/oorexx/code-0/docs/trunk
          mkdir -p "$RUNNER_TEMP/docSVN/tools"
          svn export -q "$U/tools/bldoc_orx" "$RUNNER_TEMP/docSVN/tools/bldoc_orx"
          svn export -q "$U/oorexx" "$RUNNER_TEMP/docSVN/oorexx"
          P=https://rexx.epbcn.com/rexx-parser/
          zip=$(curl -sSfL --retry 3 "$P" | grep -o 'Rexx-Parser-[^"/]*\.zip' | sort -u | tail -1)
          echo "Rexx Parser: $zip"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/parser.zip" "$P$zip"
          mkdir -p "$RUNNER_TEMP/rexx-parser" && unzip -q "$RUNNER_TEMP/parser.zip" -d "$RUNNER_TEMP/rexx-parser"
          test -f "$RUNNER_TEMP/rexx-parser/bin/Rexx.Parser.cls"
      - name: Build the books
        run: |
          DOCS_SVN=$RUNNER_TEMP/docSVN REXX_PARSER=$RUNNER_TEMP/rexx-parser \
          STAGE=$RUNNER_TEMP/books-build OUT=$RUNNER_TEMP/books scripts/build-books.sh
      - uses: actions/upload-artifact@v6
        with:
          name: books
          path: |
            ${{ runner.temp }}/books/*.pdf
            ${{ runner.temp }}/books/*-html.zip
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: books-logs
          path: |
            ${{ runner.temp }}/books-build/*.log
            ${{ runner.temp }}/books-build/bldoc/log_files

  nuget:
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20                   # a hang fails here, not after 6 hours
    steps:
      - run: echo "REXXNET_BUILD=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: natives
      - name: Pack
        run: |
          V=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=(--version "${GITHUB_REF_NAME#v}"); fi
          bridge/pack.sh "${V[@]}" --native win-x64=natives/native-win-x64/rexxnet.dll \
                         --native osx-arm64=natives/native-osx-arm64/librexxnet.dylib nupkg
          unzip -l nupkg/Rexx.Net.*[0-9].nupkg
      - uses: actions/upload-artifact@v6
        with:
          name: nuget
          path: nupkg/*
      - name: Binary zip (every system)
        run: |
          V=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=(--version "${GITHUB_REF_NAME#v}"); fi
          bridge/build.sh "$RUNNER_TEMP/managed" >/dev/null
          bridge/package.sh "${V[@]}" --managed "$RUNNER_TEMP/managed" \
                            --native linux-x64="$RUNNER_TEMP/managed/librexxnet.so" \
                            --native osx-arm64=natives/native-osx-arm64/librexxnet.dylib \
                            --native win-x64=natives/native-win-x64 zip
      - uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: zip/*.zip

  # The binary zip as a user gets it: unzipped, installed into an ooRexx
  # (portable: no administrator), a sample run from elsewhere with no
  # variables, its status, uninstalled.
  install:
    needs: nuget
    name: install (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            oorexx: ubuntu2404.x86_64
          - name: osx-arm64
            os: macos-14
            oorexx: macos.arm64.x86_64
          - name: win-x64
            os: windows-2022
            oorexx: windows.x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |                            # (7z where there is no unzip: Windows' Git Bash)
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release.zip"
          if command -v unzip >/dev/null; then unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          else 7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/oorexx.zip" >/dev/null; fi
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v7
        with:
          name: binaries
          path: zip
      - name: Install, use, uninstall
        run: |
          cd zip
          if command -v unzip >/dev/null; then unzip -q rexxnet-*.zip; else 7z x -y rexxnet-*.zip >/dev/null; fi
          cd rexxnet
          rexx install
          cd "$RUNNER_TEMP"
          samples="$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release/samples/dotnet"
          rexx "$samples/rexx/01-basics.rex"
          rexx oorexxnet-uninstall status
          rexx oorexxnet-uninstall
          if [ -e "$samples" ]; then echo "the samples are still there"; exit 1; fi

  # The Windows installer (bridge/windows-installer.sh: NSIS, a wrapper around
  # install.rex), from the binary zip; then tried as a user would: ooRexx from
  # its own installer, ours silently, a sample from elsewhere with no
  # variables, the shortcuts and the entry in Settings > Apps, its uninstaller
  windows-installer:
    needs: [nuget, books]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: binaries
          path: ${{ runner.temp }}/zip
      - uses: actions/download-artifact@v7
        with:
          name: books
          path: ${{ runner.temp }}/books
      - name: NSIS
        run: |
          if ! command -v makensis && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
      - name: Build the installer
        run: bridge/windows-installer.sh --books "$RUNNER_TEMP/books" "$RUNNER_TEMP"/zip/rexxnet-*.zip "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v6
        with:
          name: installer
          path: ${{ runner.temp }}/dist/*.exe
      - name: ooRexx r${{ env.OOREXX_REV }} (its installer, silent)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\oorexx-setup.exe"
          curl.exe -sSfL --retry 3 -o $exe "https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64.exe"
          # not Start-Process -Wait: it waits for the descendants too, and
          # rexx.exe leaves ooRexx's rxapi.exe running
          $p = Start-Process $exe -ArgumentList '/S' -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          & "C:\Program Files\ooRexx\rexx.exe" -v
      - name: Install (silent)
        shell: pwsh
        run: |
          # the PATH a new session has, with ooRexx's folder that its installer added
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\dist\*.exe").FullName
          $p = Start-Process $exe -ArgumentList '/S' -PassThru
          $p.WaitForExit()
          Get-Content "$env:TEMP\oorexxnet-install.log"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Installed, with no variables
        run: |
          R="/c/Program Files/ooRexx"
          export PATH="$R:$PATH"
          unset REXX_PATH
          cd "$RUNNER_TEMP"
          rexx oorexxnet-uninstall status
          rexx "$(cygpath -w "$R/samples/dotnet/rexx/01-basics.rex")"
          printf 'say .net~System~Environment~Version~ToString .net~System~String~IsNullOrEmpty("")~class~id\n::requires "net.cls"\n' > v.rex
          rexx v.rex | tee v.out
          grep -q " Boolean$" v.out
          test -f "$R/rexxnet.dll" && test -f "$R/net.cls" && test -f "$R/boolean.cls" && test -f "$R/oodnet.cls" && test -f "$R/uninstall-oorexxnet.exe"
          test -f "$R/samples/dotnet/guide.md"
          SM="/c/ProgramData/Microsoft/Windows/Start Menu/Programs/Open Object Rexx"
          ls -R "$SM" | grep -i "\.NET"
          test -f "$SM/ooRexx Documentation/ooRexx and .NET - Reference.lnk"
          test -f "$SM/ooRexx Documentation/ooRexx and .NET - Cookbook.lnk"
          test -f "$R/doc/dotnetref.pdf" && test -f "$R/doc/dotnetcookbook.pdf"
          test -f "$SM/ooRexx Samples/ooRexx and .NET samples.lnk"
          test -f "$SM/Uninstall ooRexx-.NET.lnk"
          reg query 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\ooRexxNet' /reg:32
      - name: Uninstall (silent)
        shell: pwsh
        run: |
          # _?=: wait for it (it would copy itself to TEMP and return at once)
          $p = Start-Process "C:\Program Files\ooRexx\uninstall-oorexxnet.exe" -ArgumentList '/S', '_?=C:\Program Files\ooRexx' -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Remove-Item "C:\Program Files\ooRexx\uninstall-oorexxnet.exe"   # _?= leaves it
      - name: Uninstalled
        run: |
          R="/c/Program Files/ooRexx"
          # (not "! test ...": bash -e does not stop on a negated command)
          for f in rexxnet.dll net.cls boolean.cls oodnet.cls Rexx.Net.dll oorexxnet-uninstall.rex oorexxnet-installed.txt samples/dotnet doc/dotnetref.pdf doc/dotnetcookbook.pdf; do
            if [ -e "$R/$f" ]; then echo "still there: $f"; exit 1; fi
          done
          if ls -R "/c/ProgramData/Microsoft/Windows/Start Menu/Programs/Open Object Rexx" | grep -i "\.NET"; then exit 1; fi
          if reg query 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\ooRexxNet' /reg:32; then exit 1; fi
          test -f "$R/rexx.exe"           # ooRexx itself untouched

  publish:
    if: github.ref_type == 'tag'
    needs: [nuget, install, windows-installer, books]
    runs-on: ubuntu-24.04
    timeout-minutes: 20                   # a hang fails here, not after 6 hours
    permissions:
      contents: write                       # the GitHub release
      id-token: write                       # nuget.org's trusted publishing (OIDC)
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: nuget
          path: nupkg
      - uses: actions/download-artifact@v7
        with:
          name: binaries
          path: zip
      - uses: actions/download-artifact@v7
        with:
          name: installer
          path: zip
      - uses: actions/download-artifact@v7
        with:
          name: books
          path: books
      # Trusted publishing: no stored API key; nuget.org's policy names this
      # repository and build.yml, and gives a key valid for an hour
      - name: nuget.org login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # the nuget.org user name (profile), not an e-mail
      - name: nuget.org
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          cat > notes.md <<'NOTES'
          **On Windows, the simplest is `oorexxnet-…-setup.exe`** (below, under Assets): it installs the bridge into an installed ooRexx (64-bit), with its samples and shortcuts in ooRexx's Start menu folder, and an uninstaller in Settings > Apps. It needs .NET 8 or later (the .NET Desktop Runtime, x64, for Windows Forms), from https://dotnet.microsoft.com/download/dotnet. It is not signed: Windows may say "Windows protected your PC" (More info, then Run anyway), as it does for ooRexx's own installer.

          **To use .NET from Rexx on any system, download `rexxnet-….zip`** (below, under Assets): one package for Windows (x64), Linux (x64) and macOS (Apple silicon). Unzip it, open a terminal in the folder `rexxnet` and run `rexx install` (as administrator on Windows, `sudo` on Linux and macOS, when ooRexx is in a system folder): it installs the bridge into that ooRexx, with its samples (in ooRexx's samples folder, under `dotnet`), and checks it. Its `README.md` says more, and how to use it without installing.

          **The books**: `dotnetref.pdf` (*ooRexx and .NET: Reference*) and `dotnetcookbook.pdf` (*ooRexx and .NET: Cookbook*), and their HTML (`*-html.zip`). The Windows installer puts the PDFs in ooRexx's `doc` folder and its Start menu.

          The `.nupkg` is the NuGet package, for .NET programs (C#, PowerShell...) that run Rexx code: a .NET project gets it with `dotnet add package Rexx.Net --prerelease`. Rexx programs do not need it. The `.snupkg` holds its debugging symbols.

          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${pre[@]}" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes nupkg/* zip/*.zip zip/*.exe books/*.pdf books/*-html.zip
