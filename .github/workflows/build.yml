# Builds and tests the bridge on Linux, macOS and Windows, then makes the
# NuGet package with the native library of all three, and the Windows binary
# zip. ooRexx comes from its portable builds on SourceForge, pinned to one
# revision: the bridge needs at least r13267 (ooRexx bug #2106, fixed there),
# and a newer one is taken deliberately, after checking it.
#
# A tag vX.Y.Z[-suffix] (git tag v0.1.0-preview.1 && git push origin
# v0.1.0-preview.1) also publishes: the package, with that version, to
# nuget.org (trusted publishing: a policy on nuget.org for this repository
# and build.yml; the secret NUGET_USER, the nuget.org user name), and a
# GitHub release with the package
# and the Windows zip. Pushes to main publish nothing.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  OOREXX_REV: "13268"
  OOREXX_URL: https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            oorexx: ubuntu2404.x86_64
            native: librexxnet.so
          - name: osx-arm64
            os: macos-14
            oorexx: macos.arm64.x86_64
            native: librexxnet.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "REXXNET_BUILD=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.${{ matrix.oorexx }}-portable-release/bin" >> "$GITHUB_PATH"
      - run: rexx -v
      - name: Test suites
        run: bridge/tests/run.sh
      - name: The guide's examples
        run: rexx docs/check-guide.rex
      - name: Smoke tests
        if: runner.os == 'Linux'
        run: smoke/run.sh && smoke/hostapi/run.sh
      - name: PowerShell sample
        shell: pwsh
        run: ./samples/powershell/hello.ps1 "$env:REXXNET_BUILD/rexxnet"
      - name: Samples
        run: rexx samples/check-samples.rex
      - name: C# sample (the package on nuget.org)
        run: dotnet run --project samples/csharp/hello
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.name }}
          path: ${{ env.REXXNET_BUILD }}/rexxnet/${{ matrix.native }}

  windows:
    name: win-x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'oorexx.zip'
          # curl, not Invoke-WebRequest: SourceForge gives a browser-like
          # client its download page instead of the file
          curl.exe -sSfL --retry 3 -o $zip "$env:OOREXX_URL/oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64-portable-release.zip"
          if ($LASTEXITCODE) { exit 1 }
          Expand-Archive $zip $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64-portable-release\bin" |
            Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: rexx -v
      - name: Test suites
        shell: pwsh
        run: |
          bridge\tests\run.ps1 -Out "$env:RUNNER_TEMP\build\rexxnet"
          exit $LASTEXITCODE
      - name: The guide's examples
        run: rexx docs\check-guide.rex "${{ runner.temp }}\build\rexxnet"
      - name: PowerShell sample
        shell: pwsh
        run: .\samples\powershell\hello.ps1 "$env:RUNNER_TEMP\build\rexxnet"
      - name: Samples
        run: rexx samples\check-samples.rex "${{ runner.temp }}\build\rexxnet"
      - name: C# sample (the package on nuget.org)
        run: dotnet run --project samples\csharp\hello
      - uses: actions/upload-artifact@v6
        with:
          name: native-win-x64
          path: ${{ runner.temp }}\build\rexxnet\rexxnet.dll
      - name: Windows binary zip
        shell: pwsh
        run: |
          bridge\package-windows.ps1 -Dest "$env:RUNNER_TEMP\zip"
          if (-not (Get-ChildItem "$env:RUNNER_TEMP\zip\*.zip")) { exit 1 }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-binaries
          path: ${{ runner.temp }}\zip\*.zip

  nuget:
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "REXXNET_BUILD=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.ubuntu2404.x86_64-portable-release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: natives
      - name: Pack
        run: |
          V=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=(--version "${GITHUB_REF_NAME#v}"); fi
          bridge/pack.sh "${V[@]}" --native win-x64=natives/native-win-x64/rexxnet.dll \
                         --native osx-arm64=natives/native-osx-arm64/librexxnet.dylib nupkg
          unzip -l nupkg/Rexx.Net.*[0-9].nupkg
      - uses: actions/upload-artifact@v6
        with:
          name: nuget
          path: nupkg/*

  publish:
    if: github.ref_type == 'tag'
    needs: [nuget, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write                       # the GitHub release
      id-token: write                       # nuget.org's trusted publishing (OIDC)
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: nuget
          path: nupkg
      - uses: actions/download-artifact@v7
        with:
          name: windows-binaries
          path: zip
      # Trusted publishing: no stored API key; nuget.org's policy names this
      # repository and build.yml, and gives a key valid for an hour
      - name: nuget.org login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # the nuget.org user name (profile), not an e-mail
      - name: nuget.org
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=(); case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          cat > notes.md <<'NOTES'
          **To use .NET from Rexx on Windows, download `rexxnet-windows-x64-….zip`** (below, under Assets): unzip it (say into `C:\rexxnet`), add that folder to `PATH` and `REXX_PATH`, and read its `README.txt`. Its `samples` folder has the samples: `rexx` (every platform), `windows`, and `office` (Excel, Word, PowerPoint and Excel's events, each written with `.OLEObject` and through the bridge).

          The `.nupkg` is the NuGet package, for .NET programs (C#, PowerShell...) that run Rexx code: a .NET project gets it with `dotnet add package Rexx.Net --prerelease`. Rexx programs do not need it. The `.snupkg` holds its debugging symbols.

          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${pre[@]}" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes nupkg/* zip/*.zip
