# ooDialog's dialogs and their oodnet.cls ports, measured side by side
# (samples/oodialog-net/measure-dialogs.rex), on demand: the bridge built on
# Windows and the report uploaded as measure-dialogs.log. build.yml runs the
# same report after the samples; this one only measures, so it is quicker.
name: measure-dialogs

on:
  workflow_dispatch:
  push:
    branches: ['measure*']               # (a branch to tune the sizes on)

env:
  OOREXX_REV: "13284"
  OOREXX_URL: https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'oorexx.zip'
          curl.exe -sSfL --retry 3 -o $zip "$env:OOREXX_URL/oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64-portable-release.zip"
          if ($LASTEXITCODE) { exit 1 }
          Expand-Archive $zip $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "oorexx-5.3.0-$env:OOREXX_REV.windows.x86_64-portable-release\bin" |
            Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: The bridge
        shell: pwsh
        run: |
          bridge\build.ps1 -Out "$env:RUNNER_TEMP\build\rexxnet"
          exit $LASTEXITCODE
      - name: Measured
        timeout-minutes: 8
        run: rexx samples\oodialog-net\measure-dialogs.rex "${{ runner.temp }}\build\rexxnet"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: measure-dialogs
          path: measure-dialogs.log
          if-no-files-found: ignore
